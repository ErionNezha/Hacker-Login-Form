<footer style="position:fixed;bottom:8px;right:10px;z-index:9999;font-size:11px;color:#9fb3c8;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:8px;font-family:'Segoe UI',system-ui,sans-serif;pointer-events:none;">Krijuar nga Erion Nezha</footer>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var btn = document.querySelector('input[type="submit"]');
  var user = document.querySelector('input[type="text"]');
  var pass = document.querySelector('input[type="password"]');
  if (!btn) return;
  var msg = document.createElement('div');
  msg.style.cssText = 'text-align:center;margin-top:8px;font-size:13px;min-height:18px;color:#0f0;';
  btn.parentElement.appendChild(msg);
  btn.addEventListener('click', function (e) {
    e.preventDefault();
    if (!user.value.trim() || !pass.value.trim()) {
      msg.style.color = '#f55';
      msg.textContent = '⛔ Plotëso Username dhe Password!';
    } else {
      msg.style.color = '#0f0';
      msg.textContent = '✔ ACCESS GRANTED — Mirë se erdhe, ' + user.value.trim() + '!';
    }
  });
});
</script>
